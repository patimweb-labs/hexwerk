[package]
name = "hexwerk"
version = "0.1.0"
edition = "2021"
description = "Hexwerk: Addon-Manager fuer World of Warcraft unter Linux und Proton"

# Der Kern (Praefix-Erkennung, TOC-Parser, Quellen) liegt in `crates/core` und
# wird hier als `hexwerk` eingebunden - derselbe Zuschnitt wie bei Crosspoint,
# damit die Richtung des Pfeils eindeutig bleibt: core -> ui -> dieses Paket.
[dependencies]
hexwerk = { package = "hexwerk-core", path = "crates/core" }
# GTK4-Oberflaeche, nur mit Feature `ui`. Ohne das Feature wird dieses Paket
# ohne GTK gebaut - so laeuft auch die CI, die kein GTK im Testjob hat.
hexwerk-ui = { path = "crates/ui-gtk", optional = true }

[features]
default = []
ui = ["dep:hexwerk-ui"]

[[bin]]
name = "hexwerk"
path = "src/main.rs"

[[bin]]
name = "hexwerk-gtk"
path = "src/bin/hexwerk_gtk.rs"
required-features = ["ui"]

[workspace]
members = ["crates/core"]
# Die GTK-Oberflaeche ist ein eigenes Paket mit eigener [workspace]-Tabelle:
# unabhaengig baubar (`cargo build --manifest-path crates/ui-gtk/Cargo.toml`)
# und ohne GTK im Abhaengigkeitsbaum, solange niemand sie anfasst.
exclude = ["crates/ui-gtk"]
