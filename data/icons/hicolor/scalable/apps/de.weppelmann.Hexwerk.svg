<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512" version="1.1">
  <!-- Hexwerk, App-Icon. Sechseck als Kontur, darin ein H aus drei Strichen,
       beides in Signalgruen. Kein Hintergrund, keine Verlaeufe, keine Fasen,
       kein Schatten: das Zeichen steht auf dem Untergrund, den das Thema
       vorgibt, und passt damit auf helle wie dunkle Leisten.
       Die Zeichnung ist bewusst gross im Feld (Rand 12 Prozent): in der
       Taskleiste faellt ein Zeichen mit viel Luft als kleiner Fleck auf.
       Der Kommentar steht hinter dem <svg>-Tag: ein Kommentar zwischen
       XML-Prolog und Wurzelelement laesst appstreamcli compose mit
       "icon-file-read-error" scheitern. -->
  <title>Hexwerk</title>
  <g fill="none" stroke="#39DD93" stroke-linecap="round" stroke-linejoin="round">
    <path d="M 256 29 L 451 151 L 451 361 L 256 483 L 61 361 L 61 151 Z" stroke-width="29"/>
    <path d="M 177 156 V 356 M 335 156 V 356 M 177 256 H 335" stroke-width="45"/>
  </g>
</svg>
