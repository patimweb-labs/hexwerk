<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 16 16" version="1.1">
  <!-- Hexwerk, Symbolstil (Leiste, Fenstertitel, kleine Groessen).
       Bewusst **gefuellt** statt gestrichelt: GTKs Symbol-Umfaerbung arbeitet
       mit Fuellungen. Ein mit `stroke` gezeichnetes Zeichen wird beim
       Umfaerben zu einer Flaeche, aus dem Sechseck wurde dabei ein voller
       Block und das H verschwand. Hier ist der Ring ein Pfad mit
       `fill-rule="evenodd"`, das H besteht aus drei Rechtecken. -->
  <title>Hexwerk</title>
  <g fill="currentColor">
    <path fill-rule="evenodd" d="M 8 0.75 L 14.28 4.38 L 14.28 11.62 L 8 15.25 L 1.72 11.62 L 1.72 4.38 Z
                                 M 8 2.55 L 12.62 5.22 L 12.62 10.78 L 8 13.45 L 3.38 10.78 L 3.38 5.22 Z"/>
    <rect x="4.75" y="4.20" width="1.55" height="7.60"/>
    <rect x="9.70" y="4.20" width="1.55" height="7.60"/>
    <rect x="4.75" y="7.22" width="6.50" height="1.56"/>
  </g>
</svg>
