  <g fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">
    <path d="M8 1.55 L13.6 4.78 L13.6 11.22 L8 14.45 L2.4 11.22 L2.4 4.78 Z" stroke-width="1.2"/>
    <path d="M6.05 5.35 V10.65 M9.95 5.35 V10.65 M6.05 8 H9.95" stroke-width="1.6"/>
  </g>
</svg>
