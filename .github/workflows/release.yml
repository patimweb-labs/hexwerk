name: Release

# Ablauf wie im Nachbarprojekt Crosspoint: Conventional Commits auf main,
# release-please haelt einen Release-PR aktuell; dessen Merge erzeugt Tag und
# Release, dieser Workflow baut die Pakete und haengt sie an.
#
# Getrennte Jobs, weil die Umgebungen sich ausschliessen:
#   tarball  braucht apt und die Rust-Toolchain auf einem normalen Runner
#   flatpak  braucht den GNOME-Container (flatpak-builder, Runtime) und kein Rust
# In einem Job scheitert beides: im Container gibt es kein apt, auf dem Runner
# kein vorinstalliertes flatpak-builder.

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Vorhandener Tag, z. B. v0.1.1
        required: true

permissions:
  contents: write
  pull-requests: write

env:
  CARGO_TERM_COLOR: always

jobs:
  release-please:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    outputs:
      created: ${{ steps.rp.outputs.release_created }}
      tag: ${{ steps.rp.outputs.tag_name }}
    steps:
      - uses: googleapis/release-please-action@v4
        id: rp
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  prepare:
    needs: release-please
    if: >-
      always() && (
        needs.release-please.outputs.created == 'true' ||
        startsWith(github.ref, 'refs/tags/v') ||
        github.event_name == 'workflow_dispatch'
      )
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.t.outputs.tag }}
      version: ${{ steps.t.outputs.version }}
    steps:
      - id: t
        env:
          RP_TAG: ${{ needs.release-please.outputs.tag }}
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          if [ -n "$RP_TAG" ]; then TAG="$RP_TAG"
          elif [ -n "$INPUT_TAG" ]; then TAG="$INPUT_TAG"
          else TAG="$GITHUB_REF_NAME"; fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"
      - name: Release anlegen, falls nicht vorhanden
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.t.outputs.tag }}
        run: |
          gh release view "$TAG" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1 ||
            gh release create "$TAG" -R "$GITHUB_REPOSITORY" --title "$TAG" --generate-notes --verify-tag

  # Wie in der CI: ohne eingefrorene Cargo-Quellenliste wird das Flatpak
  # uebersprungen statt rot - der Tarball erscheint trotzdem.
  flatpak-voraussetzungen:
    name: Flatpak-Voraussetzungen
    needs: prepare
    if: always() && needs.prepare.result == 'success'
    runs-on: ubuntu-latest
    outputs:
      quellen: ${{ steps.pruefen.outputs.quellen }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          ref: ${{ needs.prepare.outputs.tag }}
      - id: pruefen
        run: |
          if [ -f flatpak/new-sources.json ]; then
            echo "quellen=true" >> "$GITHUB_OUTPUT"
            echo "new-sources.json vorhanden - Flatpak wird gebaut"
          else
            echo "quellen=false" >> "$GITHUB_OUTPUT"
            echo "::notice::flatpak/new-sources.json fehlt; das Flatpak fehlt in diesem Release. Erzeugen: siehe flatpak/README.md"
          fi

  tarball:
    needs: prepare
    if: always() && needs.prepare.result == 'success'
    name: Tarball
    runs-on: ubuntu-24.04
    env:
      VERSION: ${{ needs.prepare.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          ref: ${{ needs.prepare.outputs.tag }}
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # Die Oberflaeche ist Tauri (WebKitGTK), nicht mehr GTK4/libadwaita:
      # libwebkit2gtk-4.1 statt libgtk-4-dev/libadwaita-1-dev.
      - name: WebKit-Pakete
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libwebkit2gtk-4.1-dev libgtk-3-dev \
            libayatana-appindicator3-dev librsvg2-dev pkg-config
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Oberflaeche bauen
        run: |
          # Die Bibliothek kommt als Untermodul und bringt nur Quellcode mit;
          # ihre eigenen Abhaengigkeiten (vue, lucide) muessen eigens installiert
          # werden, sonst findet vue-tsc sie nicht.
          npm --prefix weppelmann-ui install --no-audit --no-fund
          # Tokens erzeugen dist/css/vars.css und die Schriften; das ist ein
          # Bauergebnis und liegt nicht im Repo.
          npm --prefix weppelmann-ui run tokens
          npm --prefix ui ci
          npm --prefix ui run build
      - name: Kommandozeile bauen
        run: cargo build --release --locked --bin hexwerk
      # Nur das Fenster-Crate: das GTK-Crate (crates/ui-gtk) ist abgeloest und
      # zieht libadwaita nach, das auf dem Runner fehlt.
      - name: Fenster bauen
        # crates/desktop ist ein eigener Workspace (Tauri zieht WebKit nach),
        # deshalb von dort bauen statt mit -p aus dem Wurzel-Workspace.
        working-directory: crates/desktop
        run: cargo build --release --features custom-protocol
      - name: Paket schnüren
        run: |
          mkdir -p dist
          cp target/release/hexwerk dist/
          # crates/desktop hat einen eigenen Workspace, also ein eigenes target/.
          cp crates/desktop/target/release/hexwerk-desktop dist/
          cp data/de.weppelmann.Hexwerk.desktop dist/
          cp packaging/linux/de.weppelmann.Hexwerk.metainfo.xml dist/
          cp LICENSE dist/
          cp -r data/icons dist/icons
          # Pruefen, dass der Tarball nicht ohne Icon und Eintrag entsteht.
          test -f dist/icons/hicolor/512x512/apps/de.weppelmann.Hexwerk.png
          test -f dist/de.weppelmann.Hexwerk.desktop
          tar -C dist -czf "hexwerk-${VERSION}-linux-x86_64.tar.gz" .
          tar -tzf "hexwerk-${VERSION}-linux-x86_64.tar.gz" | head -20
      - uses: actions/upload-artifact@v4
        with:
          name: hexwerk
          path: target/release/hexwerk
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: hexwerk-desktop
          path: crates/desktop/target/release/hexwerk-desktop
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: tarball
          path: hexwerk-*.tar.gz
          if-no-files-found: error

  # ------------------------------------------------------------- Windows
  windows:
    needs: prepare
    name: Windows
    runs-on: windows-latest
    env:
      VERSION: ${{ needs.prepare.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          ref: ${{ needs.prepare.outputs.tag }}
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Oberflaeche bauen
        shell: bash
        run: |
          npm --prefix weppelmann-ui install --no-audit --no-fund
          npm --prefix weppelmann-ui run tokens
          npm --prefix ui ci
          npm --prefix ui run build
      - name: Kommandozeile bauen
        shell: bash
        run: cargo build --release --locked --bin hexwerk
      # crates/desktop ist ein eigener Workspace; WebView2 ist auf den
      # windows-latest-Runnern vorinstalliert.
      - name: Fenster bauen
        working-directory: crates/desktop
        shell: bash
        run: cargo build --release --features custom-protocol
      - name: Portable zip
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          $name = "hexwerk-$env:VERSION-windows-x86_64"
          New-Item -ItemType Directory -Force "dist\$name" | Out-Null
          Copy-Item target\release\hexwerk.exe "dist\$name\"
          Copy-Item crates\desktop\target\release\hexwerk-desktop.exe "dist\$name\"
          Copy-Item LICENSE, README.md "dist\$name\"
          Compress-Archive -Path "dist\$name\*" -DestinationPath "dist\$name.zip"
          Remove-Item -Recurse "dist\$name"
      - name: Installer (Inno Setup)
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) {
            choco install innosetup -y --no-progress
          }
          & $iscc "/DAppVersion=$env:VERSION" "/DSourceDir=$PWD\crates\desktop\target\release" packaging\windows\installer.iss
          Move-Item "crates\desktop\target\release\..\..\..\dist\*-setup.exe" dist\ -ErrorAction SilentlyContinue
          Get-ChildItem dist
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: dist/*
          if-no-files-found: error

  # --------------------------------------------------------------- macOS
  macos:
    needs: prepare
    name: macOS (universal)
    runs-on: macos-latest
    env:
      VERSION: ${{ needs.prepare.outputs.version }}
      MACOSX_DEPLOYMENT_TARGET: "13.0"
      MACOS_CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE }}
      MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
      MACOS_SIGNING_IDENTITY: ${{ secrets.MACOS_SIGNING_IDENTITY }}
      APPLE_ID: ${{ secrets.APPLE_ID }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          ref: ${{ needs.prepare.outputs.tag }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Oberflaeche bauen
        run: |
          npm --prefix weppelmann-ui install --no-audit --no-fund
          npm --prefix weppelmann-ui run tokens
          npm --prefix ui ci
          npm --prefix ui run build
      - name: Kommandozeile bauen (arm64 + x86_64)
        run: |
          cargo build --release --locked --bin hexwerk --target aarch64-apple-darwin
          cargo build --release --locked --bin hexwerk --target x86_64-apple-darwin
      - name: Fenster bauen (arm64 + x86_64)
        working-directory: crates/desktop
        run: |
          cargo build --release --features custom-protocol --target aarch64-apple-darwin
          cargo build --release --features custom-protocol --target x86_64-apple-darwin
      - name: App-Bundle
        run: |
          set -euo pipefail
          # Das Bundle liegt im Wurzel-target, damit lipo beide Architekturen sieht.
          app="dist/Hexwerk.app"
          mkdir -p "$app/Contents/MacOS" "$app/Contents/Resources"
          lipo -create -output "$app/Contents/MacOS/hexwerk-desktop" \
            crates/desktop/target/aarch64-apple-darwin/release/hexwerk-desktop \
            crates/desktop/target/x86_64-apple-darwin/release/hexwerk-desktop
          sed "s/@VERSION@/$VERSION/g" packaging/macos/Info.plist > "$app/Contents/Info.plist"
          iconset="$RUNNER_TEMP/AppIcon.iconset"
          mkdir -p "$iconset"
          for s in 16 32 128 256 512; do
            sips -z $s $s crates/desktop/assets/icons/icon-512.png --out "$iconset/icon_${s}x${s}.png" >/dev/null
            d=$((s * 2))
            sips -z $d $d crates/desktop/assets/icons/icon-512.png --out "$iconset/icon_${s}x${s}@2x.png" >/dev/null
          done
          iconutil -c icns "$iconset" -o "$app/Contents/Resources/AppIcon.icns"
          cp LICENSE "$app/Contents/Resources/"
      - name: Signieren
        run: |
          set -euo pipefail
          app="dist/Hexwerk.app"
          if [ -n "$MACOS_CERTIFICATE" ]; then
            kc="$RUNNER_TEMP/build.keychain"
            echo "$MACOS_CERTIFICATE" | base64 --decode > "$RUNNER_TEMP/cert.p12"
            security create-keychain -p ci "$kc"
            security set-keychain-settings -lut 3600 "$kc"
            security unlock-keychain -p ci "$kc"
            security import "$RUNNER_TEMP/cert.p12" -k "$kc" -P "$MACOS_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
            security set-key-partition-list -S apple-tool:,apple: -s -k ci "$kc"
            security list-keychains -d user -s "$kc"
            codesign --force --deep --options runtime --timestamp -s "$MACOS_SIGNING_IDENTITY" "$app"
          else
            # Ohne Zertifikat ad-hoc signieren: startet, der Nutzer bestaetigt einmal.
            codesign --force --deep -s - "$app"
          fi
          codesign --verify --verbose "$app"
      - name: Disk-Image
        run: |
          set -euo pipefail
          stage="$RUNNER_TEMP/dmg"
          mkdir -p "$stage"
          cp -R "dist/Hexwerk.app" "$stage/"
          ln -s /Applications "$stage/Applications"
          dmg="dist/hexwerk-$VERSION-macos-universal.dmg"
          hdiutil create -volname "Hexwerk" -srcfolder "$stage" -ov -format UDZO "$dmg"
          if [ -n "$MACOS_CERTIFICATE" ] && [ -n "$APPLE_ID" ]; then
            codesign --timestamp -s "$MACOS_SIGNING_IDENTITY" "$dmg"
            xcrun notarytool submit "$dmg" --apple-id "$APPLE_ID" --team-id "$APPLE_TEAM_ID" \
              --password "$APPLE_APP_PASSWORD" --wait
            xcrun stapler staple "$dmg"
          fi
          rm -rf "dist/Hexwerk.app"
      - uses: actions/upload-artifact@v4
        with:
          name: macos
          path: dist/*
          if-no-files-found: error


  flatpak:
    needs: [prepare, tarball, flatpak-voraussetzungen]
    if: >-
      always() &&
      needs.prepare.result == 'success' &&
      needs.tarball.result == 'success' &&
      needs.flatpak-voraussetzungen.outputs.quellen == 'true'
    name: Flatpak
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/flathub-infra/flatpak-github-actions:freedesktop-25.08
      options: --privileged
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          ref: ${{ needs.prepare.outputs.tag }}
      # Beide Binaries kommen fertig gebaut aus dem Tarball-Job - im
      # Flatpak-Build gibt es kein cargo.
      - uses: actions/download-artifact@v4
        with:
          name: hexwerk
          path: prebuilt
      - uses: actions/download-artifact@v4
        with:
          name: hexwerk-desktop
          path: prebuilt
      - name: Ausführbar machen
        run: |
          chmod +x prebuilt/hexwerk prebuilt/hexwerk-desktop
          ls -l prebuilt
      - uses: flatpak/flatpak-github-actions/flatpak-builder@v6
        with:
          bundle: hexwerk-${{ needs.prepare.outputs.version }}-x86_64.flatpak
          manifest-path: flatpak/de.weppelmann.Hexwerk.yml
          cache-key: flatpak-builder-${{ github.sha }}
          upload-artifact: true

  attach:
    # Wartet auf beide Paket-Jobs. Faellt einer aus (etwa weil die Quellenliste
    # noch fehlt), wird trotzdem veroeffentlicht, was da ist.
    needs: [prepare, tarball, flatpak, windows, macos]
    if: always() && needs.prepare.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: pakete
          merge-multiple: true
      - name: Pakete prüfen
        run: |
          find pakete -type f -printf '%p %s Bytes\n'
          anzahl=$(find pakete -type f \( -name '*.tar.gz' -o -name '*.flatpak' -o -name '*.zip' -o -name '*-setup.exe' -o -name '*.dmg' \) | wc -l)
          echo "Pakete gefunden: $anzahl"
          if [ "$anzahl" -eq 0 ]; then
            echo "Keine Pakete im Artefakt - Abbruch statt stillem Erfolg"; exit 1
          fi
          for endung in tar.gz flatpak zip dmg; do
            find pakete -type f -name "*.$endung" | grep -q . ||
              echo "::warning::$endung fehlt in diesem Lauf"
          done
      - name: Release sicherstellen, veröffentlichen, Pakete anhängen
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.prepare.outputs.tag }}
        run: |
          gh release view "$TAG" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1 ||
            gh release create "$TAG" -R "$GITHUB_REPOSITORY" --title "$TAG" --generate-notes --verify-tag
          find pakete -type f \( -name '*.tar.gz' -o -name '*.flatpak' -o -name '*.zip' -o -name '*-setup.exe' -o -name '*.dmg' \) -print0 |
            xargs -0 gh release upload "$TAG" -R "$GITHUB_REPOSITORY" --clobber
          gh release edit "$TAG" -R "$GITHUB_REPOSITORY" --draft=false
