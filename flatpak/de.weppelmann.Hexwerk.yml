# Flatpak für Hexwerk.
#
# Bauart wie im Nachbarprojekt wledambilight: Rust wird IM Sandkasten gebaut,
# nicht als fertiges Binary hereingereicht. Die Cargo-Quellen liegen eingefroren
# in `new-sources.json` (erzeugt aus `Cargo.lock`, siehe `flatpak/README.md`),
# damit der Bau offline und mit geprüften Prüfsummen läuft.
#
#   bash flatpak/update-sources.sh
#   flatpak run org.flatpak.Builder --user --install --force-clean \
#       build-dir flatpak/de.weppelmann.Hexwerk.yml
#
# Das Rust-Werkzeug kommt aus der freedesktop-Erweiterung; sie lässt sich mit dem
# GNOME-SDK 51 kombinieren. Geprüft im Sandkasten: cargo 1.98.0 unter
# /usr/lib/sdk/rust-stable/bin, GTK 4.24.1 und libadwaita 1.10.0 aus dem
# GNOME-SDK. Weitere Module braucht es deshalb nicht.
id: de.weppelmann.Hexwerk
runtime: org.gnome.Platform
runtime-version: '51'
sdk: org.gnome.Sdk
sdk-extensions:
  - org.freedesktop.Sdk.Extension.rust-stable
command: hexwerk-desktop

finish-args:
  # Fenster: Wayland bevorzugt, X11 als Rückfall, GPU für die Darstellung.
  - --socket=wayland
  - --socket=fallback-x11
  - --share=ipc
  - --device=dri
  # Quellen abfragen (GitHub, Tukui, WoWInterface).
  - --share=network
  # Die Wine-Präfixe liegen im Home des Nutzers, dort liegen auch die Addons.
  # Ohne diesen Zugriff findet Hexwerk im Sandkasten keine Installation.
  - --filesystem=home
  # Schlüsselbund für die optionalen Quellen Wago und CurseForge.
  - --talk-name=org.freedesktop.secrets
  # Eigene Konfiguration (~/.config/hexwerk) anlegen dürfen.
  - --filesystem=xdg-config/hexwerk:create

build-options:
  append-path: /usr/lib/sdk/rust-stable/bin
  env:
    CARGO_HOME: /run/build/hexwerk/cargo
    CARGO_NET_OFFLINE: 'true'

modules:
  # Bauart wie im Nachbarprojekt Crosspoint: die Binaries kommen fertig aus dem
  # Tarball-Job des Release-Workflows (dort wird die Oberflaeche gebaut und in
  # die Binary eingebettet). Im Flatpak-Sandkasten gibt es deshalb kein cargo
  # und kein npm - das ist Absicht, so bleibt der Bau kurz und ohne Netz.
  #
  # Lokal vorbereiten:
  #   (cd ui && npm ci && npm run build)
  #   cargo build --release --locked --bin hexwerk
  #   (cd crates/desktop && cargo build --release --features custom-protocol)
  #   mkdir -p prebuilt && cp target/release/hexwerk prebuilt/
  #   cp crates/desktop/target/release/hexwerk-desktop prebuilt/
  - name: hexwerk
    buildsystem: simple
    build-commands:
      - install -Dm755 hexwerk ${FLATPAK_DEST}/bin/hexwerk
      - install -Dm755 hexwerk-desktop ${FLATPAK_DEST}/bin/hexwerk-desktop
      - install -Dm644 data/de.weppelmann.Hexwerk.desktop ${FLATPAK_DEST}/share/applications/${FLATPAK_ID}.desktop
      - install -Dm644 packaging/linux/de.weppelmann.Hexwerk.metainfo.xml ${FLATPAK_DEST}/share/metainfo/${FLATPAK_ID}.metainfo.xml
      - install -Dm644 data/icons/hicolor/scalable/apps/${FLATPAK_ID}.svg ${FLATPAK_DEST}/share/icons/hicolor/scalable/apps/${FLATPAK_ID}.svg
      - install -Dm644 data/icons/symbolic/apps/${FLATPAK_ID}-symbolic.svg ${FLATPAK_DEST}/share/icons/hicolor/symbolic/apps/${FLATPAK_ID}-symbolic.svg
      - |
        set -eu
        for s in 16 32 48 64 128 256 512; do
          install -Dm644 "data/icons/hicolor/${s}x${s}/apps/${FLATPAK_ID}.png" \
            "${FLATPAK_DEST}/share/icons/hicolor/${s}x${s}/apps/${FLATPAK_ID}.png"
        done
        pngs=$(ls -1 "${FLATPAK_DEST}/share/icons/hicolor"/*/apps/${FLATPAK_ID}.png | wc -l)
        test "$pngs" -eq 7
        test -x "${FLATPAK_DEST}/bin/hexwerk"
        test -x "${FLATPAK_DEST}/bin/hexwerk-desktop"
        echo "Installiert: 2 Binaries (CLI + Tauri-App), Desktop-Eintrag, Metainfo, 2 SVGs, ${pngs} PNG-Groessen"
    sources:
      - type: file
        path: ../prebuilt/hexwerk
      - type: file
        path: ../prebuilt/hexwerk-desktop
      - type: dir
        path: ..
        skip:
          - target
          - build-dir
          - build-flatpak
          - .flatpak-builder
          - .flatpak-build
          - .git
          - ui/node_modules
