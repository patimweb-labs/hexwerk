[package]
name = "hexwerk-ui"
version = "0.2.2"
edition = "2021"
license = "GPL-3.0-or-later"
description = "Hexwerk: native GTK4-Oberflaeche (libadwaita)"

[lib]
name = "hexwerk_ui"
path = "src/lib.rs"

[[bin]]
name = "hexwerk-gtk"
path = "src/main.rs"

# Die Oberflaeche haengt an allen vier Paketen: der Kern liefert Clients und
# `.toc`, der Index die Suchantworten, die Quellen die Downloads und die
# Installation das Entpacken. Das ist der Zuschnitt aus PLAN §3 - die UI selbst
# enthaelt keine Quellen- und keine ZIP-Logik.
[dependencies]
hexwerk = { package = "hexwerk-core", path = "../core" }
hexwerk-sources = { path = "../sources" }
hexwerk-index = { path = "../index" }
hexwerk-install = { path = "../install" }
zip = { version = "9", default-features = false, features = ["deflate"] }
gtk = { package = "gtk4", version = "0.9", features = ["v4_6"] }
adw = { package = "libadwaita", version = "0.7", features = ["v1_6"] }
glib = "0.20"
# Der Scan, der Indexaufbau und die Installation laufen in std::thread;
# async-channel traegt ihre Ergebnisse zurueck in die MainContext (glib 0.20
# hat MainContext::channel entfernt).
async-channel = "2.5"
# Adresse installieren: ein ZIP von Hand geladen.
ureq = { version = "2", features = ["json"] }

[workspace]
members = []
