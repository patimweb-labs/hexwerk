[package]
name = "hexwerk-sources"
version = "0.4.2"
edition = "2021"
license = "GPL-3.0-or-later"
description = "Hexwerk: Addon-Quellen (GitHub, Tukui, WoWInterface, Wago, CurseForge) und Merge"

[dependencies]
hexwerk = { package = "hexwerk-core", path = "../core" }
# Blockierender Client mit rustls: die Quellen laufen im Hintergrundthread,
# ein async-Ökosystem wäre nur Ballast (PLAN.md §2).
ureq = "3"
# Antworten sind JSON; `derive` spart die handgeschriebenen Parser für die
# Formen, die wir gemessen haben (Tukui, GitHub, CurseForge).
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Ordner-Fingerprint (PLAN.md §5/§6). `sha2` statt `md5`: WoWInterface liefert
# zwar MD5, aber der Fingerprint ist unser eigener Hash und muss kollisionsfest sein.
sha2 = "0.10"
